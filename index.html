<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Analysis Workspace</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: #121212; 
            color: #ffffff;
            padding-top: 40px; 
            touch-action: manipulation; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
        #score-container {
            margin-bottom: 30px;
        }
        #score-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }
        #score { 
            font-size: 64px; 
            font-weight: 800; 
            margin: 10px 0;
            color: #00ecff;
            text-shadow: 0 0 20px rgba(0, 236, 255, 0.2);
        }
        #click-btn { 
            width: 200px;
            height: 200px;
            border-size: none;
            border-radius: 50%; 
            font-size: 24px; 
            font-weight: bold;
            cursor: pointer; 
            background: linear-gradient(135deg, #007bff, #00ecff); 
            color: white; 
            border: none; 
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.4);
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }
        #click-btn:active {
            transform: scale(0.95);
        }
        .shop-box {
            margin-top: 40px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #2a2a2a;
        }
        .upgrade-btn { 
            width: 100%;
            padding: 15px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px; 
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .upgrade-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #resource-link {
            display: inline-block;
            margin-top: 40px;
            color: #555;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }
        #resource-link:hover {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="score-container">
            <div id="score-label">Data Points Gathered</div>
            <div id="score">0</div>
        </div>
        
        <button id="click-btn" onclick="handleClick()">TAP</button>
        
        <div class="shop-box">
            <button class="upgrade-btn" id="up-1" onclick="buyAuto(1, 15)">Buy Node (Cost: <span id="c-1">15</span>)</button>
            <button class="upgrade-btn" id="up-2" onclick="buyAuto(5, 100)">Buy Core (Cost: <span id="c-2">100</span>)</button>
        </div>

        <!-- Hidden Discord Link disguised as documentation -->
        <a id="resource-link" href="https://discord.gg" target="_blank">Documentation & Study Resources</a>
    </div>

    <script>
        let count = 0;
        let gps = 0;
        let costs = [15, 100];
        let values = [1, 5];

        function updateDisplay() {
            document.getElementById('score').textContent = Math.floor(count);
            
            // Check if player can afford upgrades
            for(let i = 0; i < costs.length; i++) {
                let btn = document.getElementById('up-' + (i+1));
                if(count >= costs[i]) {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            }
        }

        function handleClick() {
            count++;
            updateDisplay();
        }

        function buyAuto(amount, baseCost) {
            let index = values.indexOf(amount);
            if (count >= costs[index]) {
                count -= costs[index];
                gps += amount;
                costs[index] = Math.floor(costs[index] * 1.6);
                document.getElementById('c-' + (index+1)).textContent = costs[index];
                updateDisplay();
            }
        }

        // Loop runs 10 times a second to ensure smooth screen updates on iPad
        setInterval(() => {
            if (gps > 0) {
                count += (gps / 10);
                updateDisplay();
            }
        }, 100);
    </script>
</body>
</html>
